<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">W-02 Toy assembly / supplied parts and build contract</title>
<desc id="desc">Revision B draft. WORKER CONSTRUCTION REFERENCE — integration-facing, no host implementation internals. Not approved or implemented.</desc>
