<text x="55" y="113" class="title">Toy surface / intuition before explanation</text>
<text x="1090" y="66" class="draft">DRAFT / APPROVAL PENDING</text>
<text x="1090" y="99" class="small">2026-09-16 / NTS</text>
<text x="55" y="155" class="note">WORKER CONSTRUCTION REFERENCE — no factory layout or management instructions</text>
<rect x="70" y="205" width="850" height="485" class="stage"/>
<text x="86" y="235" class="text">01 / TOY STAGE — YOUR BUILD AREA</text>
<circle cx="495" cy="440" r="140" class="outline"/>
<path d="M355 440H635M495 300V580" class="outline"/>
<text x="335" y="640" class="small">ILLUSTRATIVE GEOMETRY ONLY</text>
<rect x="70" y="710" width="850" height="105" class="supplied"/>
<text x="86" y="740" class="text">02 / SUPPLIED PARAMETER SURFACE — DO NOT BUILD</text>
<path d="M125 780H740" class="outline"/>
<circle cx="440" cy="780" r="11" fill="#203d52"/>
<text x="785" y="785" class="small">UNIT</text>
<text x="970" y="230" class="note">BUILD AREA / 01</text>
<text x="970" y="257" class="note">One source-grounded relationship.</text>
<text x="970" y="284" class="note">Visual change reveals its behavior.</text>
<text x="970" y="311" class="note">No introduction, paragraph or caption</text>
<text x="970" y="338" class="note">explaining the concept in the stage.</text>
<text x="970" y="365" class="note">Necessary labels, units and visual</text>
<text x="970" y="392" class="note">marks are allowed when they aid reading.</text>
<text x="970" y="419" class="note">They must not tell the learner what</text>
<text x="970" y="446" class="note">conclusion to reach before exploring.</text>
<text x="970" y="520" class="note">SUPPLIED SURFACE / 02</text>
<text x="970" y="547" class="note">One permanent external slider.</text>
<text x="970" y="574" class="note">Your toy responds to its parameter.</text>
<text x="970" y="601" class="note">Do not draw a slider or UI substitute.</text>
<text x="970" y="628" class="note">Report only essential numeric feedback.</text>
<text x="970" y="655" class="note">The supplied interface positions it.</text>
<text x="70" y="860" class="note">EXPLANATION IS A SEPARATE DELIVERABLE</text>
<text x="70" y="887" class="note">Provide deeper analysis + exact references for an accessible Explore view.</text>
<text x="70" y="914" class="note">Explore is not auto-opened and is not part of the initial toy stage.</text>
<text x="970" y="775" class="note">FITTING REQUIREMENT ONLY</text>
<text x="970" y="802" class="note">Use the supplied stage dimensions.</text>
<text x="970" y="829" class="note">No meaningful clipping or overlap.</text>
<text x="970" y="856" class="note">Do not invent a layout engine.</text>
<text x="970" y="883" class="note">Adaptive geometry research is separate.</text>
<path d="M24 970H1576M1050 970V1076M1350 970V1076" class="outline"/>
<text x="55" y="1004" class="note">NEW GENERATION / DRAWINGS ARE PROPOSALS, NOT SHIPPED REQUIREMENTS</text>
<text x="55" y="1031" class="note">Solid boundary • Shaded region: supplied surface • NTS: schematic / not to scale</text>
<text x="1070" y="1004" class="note">Drawn: Codex</text>
<text x="1070" y="1031" class="small">Approval: Donovan / pending</text>
<text x="1370" y="1004" class="note">W-01 / REV B</text>
