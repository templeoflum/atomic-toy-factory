<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">T-05 Inspection drawing / geometry, fidelity and performance</title>
<desc id="desc">Atomic Factory toy chassis engineering proposal revision A. Draft, not approved for production. All dimensions in CSS pixels unless noted. Diagram not to scale.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
<path d="M0 0L8 4L0 8" fill="none" stroke="#203d52"/>
</marker>
</defs>
<style>svg{background:#f8faf9}text{fill:#203d52;font-family:ui-monospace,Menlo,monospace}.label{font-size:20px}.note{font-size:18px}.small{font-size:15px}.heading{font-size:30px;font-weight:700}.box{fill:none;stroke:#203d52;stroke-width:2}.stage{fill:#e8f0f3;stroke:#203d52;stroke-width:2}.host{fill:#f1f3ed;stroke:#203d52;stroke-width:2}.line{fill:none;stroke:#203d52;stroke-width:2}.dim{fill:none;stroke:#718b9c;stroke-width:1;stroke-dasharray:5 4}.draft{fill:#9b432f;font-size:20px;font-weight:bold}</style>
<rect x="24" y="24" width="1552" height="1052" class="box"/>
<text x="55" y="76" class="heading">ATOMIC FACTORY / T-05</text>
<text x="55" y="116" class="heading">Inspection / geometry, fidelity and performance</text>
<text x="1070" y="75" class="draft">DRAFT — NOT FOR PRODUCTION</text>
<text x="1070" y="108" class="small">REV A / 2026-09-16 / NTS</text>
<rect x="80" y="210" width="670" height="355" class="stage"/>
<text x="96" y="240" class="label">TEST FRAME / ACTUAL EMBEDDED STAGE</text>
<rect x="110" y="265" width="610" height="270" class="dim"/>
<text x="140" y="300" class="label">P1 / ESSENTIAL LABEL BOUNDS</text>
<text x="140" y="490" class="label">P2 / GEOMETRY + STROKE EXTENTS</text>
<rect x="80" y="581" width="670" height="90" class="host"/>
<text x="96" y="611" class="label">P3 / HOST DOCK: endpoints + units + long readout</text>
<text x="800" y="225" class="note">GEOMETRY MATRIX / PROPOSED BASELINE</text>
<text x="800" y="252" class="note">298×296 • 353×351 • 598×596</text>
<text x="800" y="279" class="note">554×441 • 631×503 • 1026×768</text>
<text x="800" y="306" class="note">Add 600×240 short-wide / 240×600 tall-narrow</text>
<text x="800" y="333" class="note">These are stage sizes, not page widths.</text>
<text x="800" y="360" class="note">Sweep resizing in both directions;</text>
<text x="800" y="387" class="note">also test browser zoom + long labels.</text>
<text x="800" y="455" class="note">CONTROL / FIDELITY</text>
<text x="800" y="482" class="note">min → midpoint → max → full continuous sweep</text>
<text x="800" y="509" class="note">Compare represented relation to source.</text>
<text x="800" y="536" class="note">Pluck position must match excitation.</text>
<text x="800" y="563" class="note">Rate and phase are different variables.</text>
<text x="800" y="590" class="note">Changing scale alone is not elasticity.</text>
<text x="80" y="730" class="note">PERFORMANCE / P4</text>
<text x="80" y="757" class="note">Frame intervals + simulation/render cost.</text>
<text x="80" y="784" class="note">Record device, browser, DPR and workload.</text>
<text x="80" y="811" class="note">60 Hz / warm-up 10 s / sample 30 s.</text>
<text x="80" y="838" class="note">Proposed p95 &lt;= 20 ms; &gt;50 ms frames &lt;1%.</text>
<text x="80" y="865" class="note">Also judge perceived smoothness.</text>
<text x="80" y="892" class="note">Resize / resume / no accumulating loops.</text>
<text x="800" y="730" class="note">RELEASE RECORD</text>
<text x="800" y="757" class="note">Sheet rev + chassis rev + candidate ID</text>
<text x="800" y="784" class="note">Raw measurements + failed observations</text>
<text x="800" y="811" class="note">Operator: Keep / Rework / Shelve + reason</text>
<text x="800" y="838" class="note">Approval is not implied by static safety.</text>
<text x="800" y="865" class="note">Old toys are NOT construction references.</text>
<path d="M24 970H1576M1040 970V1076M1340 970V1076" class="line"/>
<text x="55" y="1002" class="note">TOY CHASSIS / NEW GENERATION / PROPOSED ENGINEERING STANDARD</text>
<text x="55" y="1029" class="note">Units: CSS px • NTS: not to scale • Solid: boundary • Dashed: clearance / dimension</text>
<text x="1060" y="1002" class="note">Drawn: Codex</text>
<text x="1060" y="1029" class="note">Approval: PENDING DONOVAN</text>
<text x="1360" y="1002" class="note">T-05 / REV A</text>
<text x="1360" y="1029" class="note">Sheet 5 of 5</text>
</svg>
