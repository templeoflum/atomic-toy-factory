<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letter Press</title>
  <style>
    :root {
      color-scheme: dark;
      --gap: 0.62em;
      --pressure: 18%;
      --jaw-shift: 6px;
      --squash: .987;
      --fit: 1;
      --ink: #f5f1e8;
      --muted: #999891;
      --accent: #ff6b35;
      --panel: #171816;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(255,255,255,.035), transparent 38%),
        #0e0f0d;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    main {
      width: min(980px, 100%);
      height: 100%;
      margin: auto;
      padding: clamp(12px, 4vw, 52px);
      display: grid;
      grid-template-rows: auto minmax(120px, 1fr) auto;
      gap: clamp(12px, 4vh, 38px);
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(.72rem, 1.6vw, .95rem);
      line-height: 1;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .counter {
      color: var(--muted);
      font-size: .68rem;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #292a27;
      border-radius: clamp(16px, 3vw, 24px);
      background:
        linear-gradient(90deg, rgba(255,107,53,.07), transparent 22%, transparent 78%, rgba(255,107,53,.07)),
        var(--panel);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .22;
      background-image: radial-gradient(#74756f 1px, transparent 1px);
      background-size: 18px 18px;
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%, #000 65%, transparent);
      mask-image: linear-gradient(to bottom, transparent, #000 35%, #000 65%, transparent);
    }

    .jaw {
      position: absolute;
      z-index: 2;
      top: 12%;
      bottom: 12%;
      width: clamp(15px, 3.8vw, 38px);
      border: 1px solid #40413d;
      background: linear-gradient(90deg, #22231f, #30312d);
      box-shadow: 0 14px 30px rgba(0,0,0,.4);
      transition: transform 120ms ease-out;
    }

    .jaw.left {
      left: 0;
      border-left: 0;
      border-radius: 0 10px 10px 0;
      transform: translateX(var(--jaw-shift));
    }

    .jaw.right {
      right: 0;
      border-right: 0;
      border-radius: 10px 0 0 10px;
      transform: translateX(calc(var(--jaw-shift) * -1));
    }

    .word-wrap {
      position: absolute;
      inset-block: 12%;
      inset-inline: clamp(50px, 8vw, 80px);
      min-width: 0;
      display: grid;
      place-items: center;
    }

    .word {
      display: inline-flex;
      flex: none;
      align-items: center;
      gap: var(--gap);
      color: var(--ink);
      font-family: "Arial Black", Arial, Helvetica, sans-serif;
      font-size: clamp(2.35rem, 10vw, 7.2rem);
      font-weight: 900;
      line-height: .9;
      white-space: nowrap;
      text-transform: uppercase;
      text-shadow: 0 8px 30px rgba(0,0,0,.45);
      transform: scale(var(--fit)) scaleY(var(--squash));
      transition: gap 80ms linear, transform 80ms linear;
      transform-origin: center;
      will-change: gap, transform;
    }

    .word span { display: block; }

    .control-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px 24px;
      align-items: end;
      padding: clamp(15px, 3vw, 28px);
      border: 1px solid #292a27;
      border-radius: clamp(16px, 2.5vw, 20px);
      background: #141512;
    }

    label {
      grid-column: 1;
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    output {
      grid-column: 2;
      grid-row: 1 / 3;
      min-width: 8.5ch;
      align-self: center;
      text-align: right;
    }

    output strong {
      display: block;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1.15rem, 3vw, 1.75rem);
      line-height: 1.05;
      letter-spacing: -.03em;
    }

    output span {
      display: block;
      margin-top: 6px;
      color: var(--accent);
      font-size: .72rem;
      letter-spacing: .08em;
    }

    input[type="range"] {
      grid-column: 1;
      width: 100%;
      height: 34px;
      margin: 0;
      appearance: none;
      background: transparent;
      cursor: ew-resize;
      touch-action: pan-y;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent) var(--pressure), #353632 var(--pressure));
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent) var(--pressure), #353632 var(--pressure));
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 28px;
      height: 28px;
      margin-top: -12px;
      appearance: none;
      border: 5px solid #141512;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 4px 14px rgba(0,0,0,.45);
    }

    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border: 5px solid #141512;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 4px 14px rgba(0,0,0,.45);
    }

    input[type="range"]:focus-visible { outline: none; }
    input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px #141512, 0 0 0 7px var(--ink); }
    input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px #141512, 0 0 0 7px var(--ink); }

    .scale {
      grid-column: 1;
      display: flex;
      justify-content: space-between;
      margin-top: -11px;
      color: #6f706a;
      font-size: .63rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .control-panel { grid-template-columns: 1fr; gap: 9px; }
      output { grid-column: 1; grid-row: 1; text-align: right; }
      label { grid-row: 1; align-self: start; padding-top: 4px; }
      input[type="range"] { grid-row: 2; }
      .scale { grid-row: 3; }
      output span { margin-top: 3px; }
    }

    @media (max-height: 460px) {
      main { gap: 9px; padding-block: 9px; }
      .control-panel { padding-block: 10px; }
      .stage { min-height: 90px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .word, .jaw { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Letter Press</h1>
      <span class="counter" aria-hidden="true">01 / spacing</span>
    </header>

    <section class="stage" aria-label="Word spacing preview">
      <div class="jaw left" aria-hidden="true"></div>
      <div class="word-wrap" id="wordWrap">
        <div class="word" id="word" aria-label="Breathe"><span aria-hidden="true">B</span><span aria-hidden="true">r</span><span aria-hidden="true">e</span><span aria-hidden="true">a</span><span aria-hidden="true">t</span><span aria-hidden="true">h</span><span aria-hidden="true">e</span></div>
      </div>
      <div class="jaw right" aria-hidden="true"></div>
    </section>

    <section class="control-panel" aria-label="Spacing control">
      <label for="spacing">Letter spacing</label>
      <input id="spacing" type="range" min="0" max="100" value="18" aria-describedby="reading">
      <div class="scale" aria-hidden="true"><span>Airy</span><span>Compressed</span></div>
      <output id="reading" for="spacing" aria-live="polite">
        <strong>Airy</strong>
        <span>+0.62 em</span>
      </output>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const slider = document.querySelector('#spacing');
    const reading = document.querySelector('#reading');
    const word = document.querySelector('#word');
    const wordWrap = document.querySelector('#wordWrap');

    function fitWord() {
      const availableWidth = Math.max(1, wordWrap.clientWidth - 8);
      const availableHeight = Math.max(1, wordWrap.clientHeight - 8);
      const naturalWidth = word.scrollWidth;
      const naturalHeight = word.scrollHeight;
      const fit = Math.min(1, availableWidth / naturalWidth, availableHeight / naturalHeight);
      root.style.setProperty('--fit', Math.max(.01, fit).toFixed(4));
    }

    function update() {
      const pressure = Number(slider.value);
      const spacing = 0.78 * (1 - pressure / 100);
      const mood = pressure < 34 ? 'Airy' : pressure < 67 ? 'Balanced' : 'Compressed';
      const signed = `${spacing >= 0 ? '+' : ''}${spacing.toFixed(2)} em`;

      root.style.setProperty('--gap', `${spacing}em`);
      root.style.setProperty('--pressure', `${pressure}%`);
      root.style.setProperty('--jaw-shift', `${pressure * 0.35}px`);
      root.style.setProperty('--squash', String(1 - pressure * 0.0007));
      reading.replaceChildren();
      const state = document.createElement('strong');
      const value = document.createElement('span');
      state.textContent = mood;
      value.textContent = signed;
      reading.append(state, value);
      slider.setAttribute('aria-valuetext', `${mood}, ${signed}`);
      requestAnimationFrame(fitWord);
    }

    slider.addEventListener('input', update);
    new ResizeObserver(fitWord).observe(wordWrap);
    document.fonts.ready.then(fitWord);
    update();
  </script>
</body>
</html>
