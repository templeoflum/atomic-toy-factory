<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counterpoint — Letter Spacing Toy</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #121210;
      --ink: #f2efe6;
      --muted: #9c9a91;
      --line: rgba(242, 239, 230, .18);
      --accent: #ff4d2e;
      --tracking: -0.08em;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 12%, rgba(255, 77, 46, .09), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(1rem, 4vh, 2.5rem);
      padding: clamp(1rem, 4vw, 3.5rem);
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: .75rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(.75rem, 1.4vw, .95rem);
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .edition {
      color: var(--muted);
      font: 500 .7rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 5rem;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--line);
      z-index: -1;
    }

    .stage::before { top: 22%; }
    .stage::after { bottom: 22%; }

    .word {
      display: inline-block;
      max-width: 100%;
      white-space: nowrap;
      color: var(--ink);
      font-weight: 800;
      font-size: 80px;
      line-height: .88;
      letter-spacing: var(--tracking);
      text-indent: var(--tracking);
      text-align: center;
      text-transform: uppercase;
      user-select: none;
      transform: translateZ(0);
      text-shadow: 0 .07em .35em rgba(0, 0, 0, .25);
    }

    .panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "label value"
        "slider slider";
      align-items: end;
      gap: .75rem 1rem;
      padding-top: .9rem;
      border-top: 1px solid var(--line);
    }

    label {
      grid-area: label;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    output {
      grid-area: value;
      color: var(--accent);
      font: 650 clamp(.9rem, 2vw, 1.2rem)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      grid-area: slider;
      width: 100%;
      height: 2.75rem;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
      touch-action: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: .28rem;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent) 0 var(--progress), var(--line) var(--progress) 100%);
    }

    input[type="range"]::-moz-range-track {
      height: .28rem;
      border-radius: 99px;
      background: var(--line);
    }

    input[type="range"]::-moz-range-progress {
      height: .28rem;
      border-radius: 99px;
      background: var(--accent);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 1.35rem;
      height: 1.35rem;
      margin-top: -.535rem;
      appearance: none;
      -webkit-appearance: none;
      border: 3px solid var(--paper);
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }

    input[type="range"]::-moz-range-thumb {
      width: 1rem;
      height: 1rem;
      border: 3px solid var(--paper);
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }

    input[type="range"]:focus-visible { outline: none; }
    input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 1px var(--ink), 0 0 0 5px rgba(255, 77, 46, .42); }
    input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 1px var(--ink), 0 0 0 5px rgba(255, 77, 46, .42); }

    @media (max-height: 330px) {
      main { gap: .45rem; padding-block: .65rem; }
      header { padding-bottom: .4rem; }
      .panel { padding-top: .4rem; gap: .1rem 1rem; }
      input[type="range"] { height: 2rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Counterpoint</h1>
      <span class="edition" aria-hidden="true">TYPE STUDY / 01</span>
    </header>

    <section class="stage" aria-label="Live letter spacing preview">
      <div class="word">COUNTERPOINT</div>
    </section>

    <div class="panel">
      <label for="spacing">Letter spacing</label>
      <output id="reading" for="spacing" aria-live="polite">−0.08 em</output>
      <input id="spacing" type="range" min="-12" max="55" value="-8" step="1"
             aria-label="Letter spacing" aria-valuetext="minus 0.08 em">
    </div>
  </main>

  <script>
    (() => {
      const slider = document.querySelector('#spacing');
      const word = document.querySelector('.word');
      const stage = document.querySelector('.stage');
      const reading = document.querySelector('#reading');

      function format(value) {
        const amount = value / 100;
        const sign = amount < 0 ? '−' : '+';
        return `${sign}${Math.abs(amount).toFixed(2)} em`;
      }

      function fitWord() {
        // Measure at a stable reference size, then scale to both available axes.
        word.style.fontSize = '100px';
        const measuredWidth = word.getBoundingClientRect().width;
        const availableWidth = Math.max(1, stage.clientWidth - 4);
        const availableHeight = Math.max(1, stage.clientHeight * .66);
        const byWidth = 100 * availableWidth / Math.max(1, measuredWidth);
        const size = Math.max(3, Math.min(170, byWidth, availableHeight));
        word.style.fontSize = `${size}px`;
      }

      function update() {
        const value = Number(slider.value);
        const em = value / 100;
        const progress = ((value - Number(slider.min)) / (Number(slider.max) - Number(slider.min))) * 100;
        document.documentElement.style.setProperty('--tracking', `${em}em`);
        slider.style.setProperty('--progress', `${progress}%`);
        reading.value = format(value);
        slider.setAttribute('aria-valuetext', `${em < 0 ? 'minus ' : 'plus '}${Math.abs(em).toFixed(2)} em`);
        requestAnimationFrame(fitWord);
      }

      slider.addEventListener('input', update);
      new ResizeObserver(fitWord).observe(stage);
      if (document.fonts) document.fonts.ready.then(fitWord);
      update();
    })();
  </script>
</body>
</html>
