<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Common Heading</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f1e7;
      --muted: #a7aaa3;
      --line: rgba(255, 255, 255, 0.12);
      --panel: rgba(15, 20, 24, 0.82);
      --accent: #ff7a55;
      --accent-2: #ffd36a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b1013;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
    }

    main {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 320px;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% 10%, rgba(255, 122, 85, 0.09), transparent 35%),
        linear-gradient(145deg, #10171b 0%, #081013 100%);
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.3;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .header {
      position: absolute;
      top: clamp(18px, 4vw, 42px);
      left: clamp(18px, 5vw, 64px);
      right: clamp(18px, 5vw, 64px);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4.6vw, 58px);
      line-height: .95;
      letter-spacing: -.055em;
      font-weight: 720;
    }

    .order {
      min-width: 112px;
      padding-top: 3px;
      text-align: right;
    }

    .order-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .order-value {
      display: block;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .control-card {
      position: absolute;
      left: 50%;
      bottom: clamp(16px, 4vw, 38px);
      width: min(520px, calc(100% - 32px));
      transform: translateX(-50%);
      padding: 18px 20px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter: blur(16px);
    }

    .control-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    label {
      font-size: 13px;
      font-weight: 680;
      letter-spacing: .01em;
    }

    output {
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      --fill: 45%;
      width: 100%;
      height: 28px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 99px;
      background: linear-gradient(to right, var(--accent) 0 var(--fill), rgba(255,255,255,.14) var(--fill) 100%);
    }

    input[type="range"]::-moz-range-track {
      height: 5px;
      border-radius: 99px;
      background: rgba(255,255,255,.14);
    }

    input[type="range"]::-moz-range-progress {
      height: 5px;
      border-radius: 99px;
      background: var(--accent);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 24px;
      height: 24px;
      margin-top: -9.5px;
      appearance: none;
      -webkit-appearance: none;
      border: 6px solid var(--ink);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 12px rgba(0,0,0,.45);
    }

    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 6px solid var(--ink);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 12px rgba(0,0,0,.45);
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 5px;
      border-radius: 10px;
    }

    .scale {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    @media (max-height: 500px) {
      .header { top: 16px; }
      .control-card { bottom: 12px; padding: 12px 16px 13px; }
      .control-head { margin-bottom: 7px; }
      h1 { font-size: clamp(25px, 8vh, 42px); }
    }
  </style>
</head>
<body>
  <main>
    <canvas id="field" role="img" aria-label="Animated group of particles moving through a shared field"></canvas>

    <header class="header">
      <div>
        <p class="eyebrow">Collective behavior</p>
        <h1>Common<br>Heading</h1>
      </div>
      <div class="order" aria-label="Current group coordination">
        <span class="order-label">Coordination</span>
        <span class="order-value" id="orderValue">0%</span>
      </div>
    </header>

    <section class="control-card" aria-label="Simulation control">
      <div class="control-head">
        <label for="alignment">Neighbor alignment</label>
        <output id="alignmentValue" for="alignment" aria-live="polite">45%</output>
      </div>
      <input id="alignment" type="range" min="0" max="100" value="45" aria-describedby="scaleLabels">
      <div class="scale" id="scaleLabels" aria-hidden="true">
        <span>Independent</span>
        <span>In step</span>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('field');
      const ctx = canvas.getContext('2d', { alpha: true });
      const slider = document.getElementById('alignment');
      const alignmentValue = document.getElementById('alignmentValue');
      const orderValue = document.getElementById('orderValue');

      let width = 0;
      let height = 0;
      let dpr = 1;
      let agents = [];
      let alignment = Number(slider.value) / 100;
      let lastTime = performance.now();
      let displayedOrder = 0;

      const TAU = Math.PI * 2;
      const countForArea = () => Math.max(34, Math.min(88, Math.round(width * height / 11500)));

      function createAgent(index) {
        const angle = Math.random() * TAU;
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          vx: Math.cos(angle) * (0.65 + Math.random() * 0.65),
          vy: Math.sin(angle) * (0.65 + Math.random() * 0.65),
          phase: Math.random() * TAU,
          size: 3.2 + Math.random() * 2.5,
          warm: index % 7 === 0
        };
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const targetCount = countForArea();
        while (agents.length < targetCount) agents.push(createAgent(agents.length));
        if (agents.length > targetCount) agents.length = targetCount;
        for (const a of agents) {
          a.x = Math.min(a.x, width);
          a.y = Math.min(a.y, height);
        }
      }

      function shortestDelta(delta, span) {
        if (delta > span / 2) return delta - span;
        if (delta < -span / 2) return delta + span;
        return delta;
      }

      function update(dt, time) {
        const influenceRadius = Math.max(58, Math.min(105, Math.min(width, height) * 0.16));
        const influenceSq = influenceRadius * influenceRadius;
        const separationSq = 22 * 22;
        const next = new Array(agents.length);
        const alignForce = 0.012 + alignment * alignment * 0.125;
        const noiseForce = 0.055 * Math.pow(1 - alignment, 1.6) + 0.002;

        let sumX = 0;
        let sumY = 0;

        for (let i = 0; i < agents.length; i++) {
          const a = agents[i];
          let avgVx = 0;
          let avgVy = 0;
          let centerX = 0;
          let centerY = 0;
          let separateX = 0;
          let separateY = 0;
          let neighbors = 0;

          for (let j = 0; j < agents.length; j++) {
            if (i === j) continue;
            const b = agents[j];
            const dx = shortestDelta(b.x - a.x, width);
            const dy = shortestDelta(b.y - a.y, height);
            const distSq = dx * dx + dy * dy;
            if (distSq < influenceSq) {
              avgVx += b.vx;
              avgVy += b.vy;
              centerX += dx;
              centerY += dy;
              neighbors++;
              if (distSq < separationSq && distSq > 0.01) {
                const weight = 1 - Math.sqrt(distSq) / 22;
                separateX -= dx * weight;
                separateY -= dy * weight;
              }
            }
          }

          let vx = a.vx;
          let vy = a.vy;
          if (neighbors) {
            avgVx /= neighbors;
            avgVy /= neighbors;
            const avgMag = Math.hypot(avgVx, avgVy) || 1;
            vx += (avgVx / avgMag - vx) * alignForce * dt;
            vy += (avgVy / avgMag - vy) * alignForce * dt;
            vx += (centerX / neighbors) * 0.00045 * dt;
            vy += (centerY / neighbors) * 0.00045 * dt;
            vx += separateX * 0.0032 * dt;
            vy += separateY * 0.0032 * dt;
          }

          const wander = time * 0.0013 + a.phase;
          vx += Math.cos(wander * 1.31) * noiseForce * dt;
          vy += Math.sin(wander * 1.07) * noiseForce * dt;

          const speed = Math.hypot(vx, vy) || 1;
          const targetSpeed = 0.82 + alignment * 0.38;
          vx = vx / speed * (speed + (targetSpeed - speed) * 0.035 * dt);
          vy = vy / speed * (speed + (targetSpeed - speed) * 0.035 * dt);

          const x = (a.x + vx * dt + width) % width;
          const y = (a.y + vy * dt + height) % height;
          next[i] = { ...a, x, y, vx, vy };

          const m = Math.hypot(vx, vy) || 1;
          sumX += vx / m;
          sumY += vy / m;
        }

        agents = next;
        const order = Math.hypot(sumX, sumY) / agents.length;
        displayedOrder += (order - displayedOrder) * Math.min(1, 0.04 * dt);
        orderValue.textContent = Math.round(displayedOrder * 100) + '%';
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        for (const a of agents) {
          const angle = Math.atan2(a.vy, a.vx);
          const speed = Math.hypot(a.vx, a.vy);
          const tail = 9 + speed * 7;

          ctx.beginPath();
          ctx.moveTo(a.x - Math.cos(angle) * tail, a.y - Math.sin(angle) * tail);
          ctx.lineTo(a.x, a.y);
          const trail = ctx.createLinearGradient(
            a.x - Math.cos(angle) * tail, a.y - Math.sin(angle) * tail, a.x, a.y
          );
          trail.addColorStop(0, 'rgba(255,255,255,0)');
          trail.addColorStop(1, a.warm ? 'rgba(255,122,85,.28)' : 'rgba(223,235,230,.2)');
          ctx.strokeStyle = trail;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.save();
          ctx.translate(a.x, a.y);
          ctx.rotate(angle);
          ctx.beginPath();
          ctx.moveTo(a.size * 1.55, 0);
          ctx.lineTo(-a.size, a.size * 0.72);
          ctx.lineTo(-a.size * 0.45, 0);
          ctx.lineTo(-a.size, -a.size * 0.72);
          ctx.closePath();
          ctx.fillStyle = a.warm ? '#ff8a67' : '#e5eee9';
          ctx.shadowColor = a.warm ? 'rgba(255,122,85,.7)' : 'rgba(213,236,226,.5)';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }
      }

      function frame(now) {
        const dt = Math.min(2.2, (now - lastTime) / 16.667 || 1);
        lastTime = now;
        update(dt, now);
        draw();
        requestAnimationFrame(frame);
      }

      function syncControl() {
        alignment = Number(slider.value) / 100;
        const text = slider.value + '%';
        alignmentValue.textContent = text;
        slider.style.setProperty('--fill', text);
      }

      slider.addEventListener('input', syncControl);
      window.addEventListener('resize', resize, { passive: true });
      syncControl();
      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
