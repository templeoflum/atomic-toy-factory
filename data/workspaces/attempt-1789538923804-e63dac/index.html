<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elastic Constellation</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f0ff;
      --muted: #aaa3c2;
      --violet: #b99cff;
      --cyan: #92e7ff;
      --panel: rgba(18, 14, 37, .7);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070611;
    }

    body {
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", sans-serif;
      color: var(--ink);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
      background:
        radial-gradient(circle at 49% 43%, rgba(85, 61, 145, .17), transparent 36%),
        radial-gradient(circle at 12% 10%, rgba(63, 120, 161, .11), transparent 30%),
        linear-gradient(160deg, #0d0a1d 0%, #070611 70%);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    header {
      position: absolute;
      z-index: 2;
      top: clamp(20px, 5vh, 46px);
      left: 50%;
      width: min(88vw, 540px);
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 3.2vw, 1.8rem);
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(185, 156, 255, .35);
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(.75rem, 2vw, .9rem);
      letter-spacing: .08em;
    }

    .control {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(88vw, 430px);
      padding: 17px 20px 19px;
      transform: translateX(-50%);
      border: 1px solid rgba(204, 190, 255, .14);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .35), inset 0 1px rgba(255, 255, 255, .05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .control__top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    label {
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #c8c1dc;
    }

    output {
      min-width: 6.2ch;
      color: var(--cyan);
      font-size: .86rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: .05em;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      height: 32px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
      touch-action: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--violet) var(--fill), rgba(177, 163, 213, .2) var(--fill));
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .45);
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--violet) var(--fill), rgba(177, 163, 213, .2) var(--fill));
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .45);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 25px;
      height: 25px;
      margin-top: -9.5px;
      appearance: none;
      -webkit-appearance: none;
      border: 5px solid #f9f6ff;
      border-radius: 50%;
      background: #9876ee;
      box-shadow: 0 0 0 4px rgba(185, 156, 255, .16), 0 0 22px rgba(185, 156, 255, .65);
    }

    input[type="range"]::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border: 5px solid #f9f6ff;
      border-radius: 50%;
      background: #9876ee;
      box-shadow: 0 0 0 4px rgba(185, 156, 255, .16), 0 0 22px rgba(185, 156, 255, .65);
    }

    input[type="range"]:focus-visible { outline: none; }
    input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 5px rgba(146, 231, 255, .38), 0 0 25px rgba(146, 231, 255, .7); }
    input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 5px rgba(146, 231, 255, .38), 0 0 25px rgba(146, 231, 255, .7); }

    @media (max-height: 430px) {
      header { top: 14px; text-align: left; left: 20px; transform: none; }
      header p { display: none; }
      .control { left: auto; right: 18px; bottom: 14px; width: min(46vw, 360px); transform: none; padding: 12px 16px 14px; }
      .control__top { margin-bottom: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      canvas { opacity: .95; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <canvas id="sky" aria-hidden="true"></canvas>
    <header>
      <h1 id="title">Elastic Constellation</h1>
      <p>Stretch the pattern and watch it settle.</p>
    </header>

    <div class="control">
      <div class="control__top">
        <label for="spacing">Star spacing</label>
        <output id="readout" for="spacing" aria-live="polite">100%</output>
      </div>
      <input id="spacing" type="range" min="55" max="145" value="100" step="1" aria-describedby="readout" style="--fill: 50%">
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.querySelector('#sky');
      const ctx = canvas.getContext('2d');
      const slider = document.querySelector('#spacing');
      const readout = document.querySelector('#readout');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const shape = [
        [-0.86,  0.08], [-0.56, -0.42], [-0.18, -0.22],
        [ 0.02, -0.70], [ 0.24, -0.18], [ 0.72, -0.42],
        [ 0.88,  0.12], [ 0.42,  0.36], [ 0.06,  0.76],
        [-0.28,  0.31], [-0.70,  0.55]
      ];
      const links = [[0,1],[1,2],[2,3],[2,4],[3,4],[4,5],[5,6],[6,7],[7,8],[8,9],[9,10],[10,0],[9,2],[9,4],[9,7]];
      const stars = shape.map((p, i) => ({ x: p[0], y: p[1], vx: 0, vy: 0, phase: i * 1.73, r: [2.4, 3.2, 2.1, 3.5, 2.6][i % 5] }));
      let dust = [];
      let width = 0;
      let height = 0;
      let dpr = 1;
      let scaleNow = 1;
      let scaleTarget = 1;
      let last = performance.now();

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.min(150, Math.max(45, Math.round(width * height / 9000)));
        dust = Array.from({ length: count }, (_, i) => ({
          x: ((i * 197.31) % 1000) / 1000 * width,
          y: ((i * 431.17 + 71) % 1000) / 1000 * height,
          r: .35 + ((i * 29) % 10) / 14,
          a: .13 + ((i * 17) % 10) / 24,
          p: i * .87
        }));
      }

      function updateValue() {
        const value = Number(slider.value);
        scaleTarget = value / 100;
        readout.value = `${value}%`;
        slider.style.setProperty('--fill', `${(value - 55) / 90 * 100}%`);
      }

      function frame(now) {
        const dt = Math.min((now - last) / 1000, .033);
        last = now;
        scaleNow += (scaleTarget - scaleNow) * (reduceMotion ? 1 : 1 - Math.exp(-dt * 6));

        const compact = height < 430;
        const reserved = compact ? 40 : 150;
        const base = Math.max(64, Math.min(width * .34, (height - reserved) * .34, 250));
        const cx = compact ? width * .36 : width * .5;
        const cy = compact ? height * .53 : height * .47;
        const targetScale = base * scaleNow;

        ctx.clearRect(0, 0, width, height);

        for (const speck of dust) {
          const twinkle = reduceMotion ? 1 : .72 + .28 * Math.sin(now * .0007 + speck.p);
          ctx.fillStyle = `rgba(208,220,255,${speck.a * twinkle})`;
          ctx.beginPath();
          ctx.arc(speck.x, speck.y, speck.r, 0, Math.PI * 2);
          ctx.fill();
        }

        for (let i = 0; i < stars.length; i++) {
          const star = stars[i];
          const tx = cx + shape[i][0] * targetScale;
          const ty = cy + shape[i][1] * targetScale * .72;
          if (!star.ready || reduceMotion) {
            star.x = tx;
            star.y = ty;
            star.ready = true;
          } else {
            const spring = 45;
            const damping = Math.exp(-dt * 7.5);
            star.vx = (star.vx + (tx - star.x) * spring * dt) * damping;
            star.vy = (star.vy + (ty - star.y) * spring * dt) * damping;
            star.x += star.vx * dt;
            star.y += star.vy * dt;
          }
        }

        ctx.save();
        ctx.lineCap = 'round';
        for (const [a, b] of links) {
          const one = stars[a];
          const two = stars[b];
          const stretch = Math.hypot(one.x - two.x, one.y - two.y) / Math.max(base, 1);
          const alpha = Math.max(.18, .52 - stretch * .12);
          const gradient = ctx.createLinearGradient(one.x, one.y, two.x, two.y);
          gradient.addColorStop(0, `rgba(146,231,255,${alpha})`);
          gradient.addColorStop(1, `rgba(185,156,255,${alpha})`);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 1.1;
          ctx.shadowColor = 'rgba(148, 190, 255, .35)';
          ctx.shadowBlur = 7;
          ctx.beginPath();
          ctx.moveTo(one.x, one.y);
          const sag = Math.min(9, Math.abs(scaleTarget - base) * .035);
          ctx.quadraticCurveTo((one.x + two.x) / 2, (one.y + two.y) / 2 + sag, two.x, two.y);
          ctx.stroke();
        }
        ctx.restore();

        for (const star of stars) {
          const pulse = reduceMotion ? 1 : 1 + Math.sin(now * .002 + star.phase) * .08;
          const glow = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.r * 5.8);
          glow.addColorStop(0, 'rgba(255,255,255,.95)');
          glow.addColorStop(.18, 'rgba(181,222,255,.88)');
          glow.addColorStop(1, 'rgba(161,132,255,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r * 5.8 * pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r * .66 * pulse, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(frame);
      }

      slider.addEventListener('input', updateValue);
      addEventListener('resize', resize, { passive: true });
      resize();
      updateValue();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
