<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find the balance</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f0e6;color:#29463e;font-family:system-ui,sans-serif}main{width:min(780px,100%)}h1{margin:0 0 7px;font-size:clamp(24px,5vw,36px);letter-spacing:-1px}p{margin:0;color:#6d7b70;font-size:14px;line-height:1.5}.stage{margin:22px 0 18px;background:#e3e9da;border:1px solid #d5decc;border-radius:24px;overflow:hidden}svg{display:block;width:100%;height:auto}section{background:#fffdf7;border:1px solid #deddd1;border-radius:20px;padding:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}label{font-weight:650}output{font-size:14px;font-variant-numeric:tabular-nums}input{width:100%;height:36px;margin:15px 0 3px;accent-color:#297b67;cursor:pointer;touch-action:pan-y}input:focus-visible{outline:3px solid #c89739;outline-offset:3px;border-radius:12px}.ends{display:flex;justify-content:space-between;color:#839080;font-size:11px}#status{font-weight:700;margin:15px 0 4px;color:#98623e}#forces{font-size:12px;font-variant-numeric:tabular-nums}footer{text-align:center;font-size:12px;color:#74816f;margin-top:16px}@media(max-width:400px){body{padding:12px}section{padding:16px}.row{font-size:14px}output{font-size:12px}}
</style></head><body><main>
<h1>Find the balance</h1><p>Two unequal weights. One perfect pivot.</p>
<div class="stage"><svg viewBox="0 0 800 330" role="img" aria-labelledby="title desc"><title id="title">Two weights on a movable lever</title><desc id="desc">A 2 kilogram weight on the left and a 5 kilogram weight on the right. Move the fulcrum to balance their turning forces.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d3ddc9"/></pattern></defs><rect width="800" height="330" fill="url(#grid)" opacity=".6"/>
<path d="M60 284H740" stroke="#b7c6ad" stroke-width="2"/><ellipse id="shadow" cy="283" rx="65" ry="8" fill="#29463e" opacity=".1"/>
<path id="support" fill="#478b76" stroke="#296651" stroke-width="2" stroke-linejoin="round"/><path id="beam" stroke="#344f43" stroke-width="14" stroke-linecap="round"/>
<g id="light"><rect x="-30" y="-57" width="60" height="50" rx="9" fill="#dfb354" stroke="#b08630" stroke-width="2"/><path d="M-18-47H18" stroke="#f9da8d" stroke-width="3" stroke-linecap="round"/><text y="-26" text-anchor="middle" font-size="19" font-weight="700" fill="#654719">2 kg</text></g>
<g id="heavy"><rect x="-42" y="-85" width="84" height="78" rx="11" fill="#ca765b" stroke="#a85840" stroke-width="2"/><path d="M-28-74H28" stroke="#eea48a" stroke-width="3" stroke-linecap="round"/><text y="-42" text-anchor="middle" font-size="22" font-weight="700" fill="#fff4e9">5 kg</text></g>
<circle id="pivot" cy="196" r="6" fill="#f5efdd" stroke="#28644f" stroke-width="3"/><text x="400" y="313" text-anchor="middle" font-size="11" letter-spacing="2" fill="#6d8266">MOVE THE PIVOT · WATCH THE LEVER</text></svg></div>
<section aria-label="Lever controls"><div class="row"><label for="fulcrum">Fulcrum position</label><output id="value" for="fulcrum"></output></div><input id="fulcrum" type="range" min="25" max="80" step="0.5" value="50" aria-describedby="hint"><div class="ends"><span>← Left</span><span>Right →</span></div><p id="status" role="status" aria-live="polite"></p><p id="forces"></p></section>
<footer id="hint">Balance when weight × distance is equal on both sides.</footer>
</main><script>
(()=>{const el=id=>document.getElementById(id),slider=el('fulcrum');let shown=50,target=50,frame=0;
function draw(p){const x=80+p*6.4,y=196,angle=Math.max(-.21,Math.min(.21,(65-p)*.012));const point=v=>({x:x+(v-x)*Math.cos(angle),y:y+(v-x)*Math.sin(angle)});const a=point(106),b=point(694),l=point(176),r=point(624);el('beam').setAttribute('d',`M${a.x} ${a.y}L${b.x} ${b.y}`);el('light').setAttribute('transform',`translate(${l.x} ${l.y})`);el('heavy').setAttribute('transform',`translate(${r.x} ${r.y})`);el('support').setAttribute('d',`M${x} 199L${x-42} 280Q${x} 286 ${x+42} 280Z`);el('pivot').setAttribute('cx',x);el('shadow').setAttribute('cx',x);}
function animate(){shown+=(target-shown)*.18;if(Math.abs(target-shown)<.015)shown=target;draw(shown);frame=shown===target?0:requestAnimationFrame(animate);}
function update(){target=Number(slider.value);const balanced=target===65,status=balanced?'Perfect balance!':target<65?'Right side sinks':'Left side sinks';el('value').textContent=`${target}% from left`;slider.setAttribute('aria-valuetext',`${target} percent from left. ${status}`);el('status').textContent=status;el('status').style.color=balanced?'#287967':'#98623e';el('forces').textContent=`Turning force: left ${(2*(target-15)).toFixed(1)} · right ${(5*(85-target)).toFixed(1)} (kg × distance units)`;if(!frame)frame=requestAnimationFrame(animate);}
slider.addEventListener('input',update);draw(shown);update();})();
</script></body></html>
