<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crosshatch — Moiré Study</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #eee5d3;
      --paper-light: #f7f0e2;
      --ink: #171512;
      --quiet: #6e675c;
      --hairline: rgba(23, 21, 18, .18);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      background:
        radial-gradient(circle at 26% 14%, rgba(255,255,255,.44), transparent 31%),
        repeating-linear-gradient(0deg, rgba(60,45,24,.018) 0 1px, transparent 1px 4px),
        var(--paper);
    }

    main {
      width: min(100%, 980px);
      height: 100%;
      margin: 0 auto;
      padding: clamp(18px, 4vw, 44px);
      display: grid;
      grid-template-rows: auto minmax(140px, 1fr) auto;
      gap: clamp(12px, 2.5vh, 26px);
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 12px;
    }

    .kicker,
    .note {
      margin: 0;
      color: var(--quiet);
      font-size: clamp(.62rem, 1.3vw, .72rem);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 5px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.9rem, 5vw, 3.2rem);
      font-weight: 400;
      line-height: .95;
      letter-spacing: -.045em;
    }

    .note {
      text-align: right;
      line-height: 1.55;
      letter-spacing: .08em;
    }

    .stage {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .stage::before {
      content: "";
      position: absolute;
      width: min(69vmin, 580px);
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: 0 18px 50px rgba(61,45,20,.13);
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 140px;
    }

    .controls {
      border-top: 1px solid var(--hairline);
      padding-top: 13px;
    }

    .control-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 7px;
    }

    label {
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    output {
      min-width: 5ch;
      text-align: right;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    input[type="range"] {
      width: 100%;
      height: 42px;
      margin: 0;
      padding: 0;
      appearance: none;
      background: transparent;
      cursor: ew-resize;
      touch-action: pan-y;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      background: var(--ink);
    }

    input[type="range"]::-moz-range-track {
      height: 3px;
      background: var(--ink);
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 26px;
      height: 26px;
      margin-top: -11.5px;
      appearance: none;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--paper-light);
      box-shadow: 0 2px 0 rgba(23,21,18,.16);
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--paper-light);
      box-shadow: 0 2px 0 rgba(23,21,18,.16);
    }

    input[type="range"]:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    .scale {
      display: flex;
      justify-content: space-between;
      color: var(--quiet);
      font-size: .65rem;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 480px) {
      main { padding-inline: 16px; }
      .note { display: none; }
    }

    @media (max-height: 500px) {
      main { padding-block: 12px; gap: 8px; }
      header { padding-bottom: 7px; }
      .kicker, .note { display: none; }
      h1 { margin: 0; font-size: 1.65rem; }
      .controls { padding-top: 7px; }
      .control-head { margin: 0; }
      input[type="range"] { height: 32px; }
      canvas { min-height: 100px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="kicker">Optical study / 01</p>
        <h1>Crosshatch</h1>
      </div>
      <p class="note" aria-hidden="true">Two grids<br>one angle</p>
    </header>

    <section class="stage" aria-label="Moiré interference display">
      <canvas id="moire" role="img" aria-label="Two overlapping fields of fine black parallel lines, one rotated against the other"></canvas>
    </section>

    <section class="controls" aria-label="Rotation control">
      <div class="control-head">
        <label for="angle">Relative angle</label>
        <output id="readout" for="angle" aria-live="polite">+3.2°</output>
      </div>
      <input id="angle" type="range" min="-12" max="12" step="0.1" value="3.2" aria-valuetext="positive 3.2 degrees">
      <div class="scale" aria-hidden="true"><span>−12°</span><span>0°</span><span>+12°</span></div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('moire');
      const ctx = canvas.getContext('2d');
      const slider = document.getElementById('angle');
      const readout = document.getElementById('readout');
      let width = 1;
      let height = 1;
      let angle = Number(slider.value);

      function lineField(rotation, radius, spacing, lineWidth, alpha) {
        const reach = radius * 1.48;
        ctx.save();
        ctx.translate(width / 2, height / 2);
        ctx.rotate(rotation * Math.PI / 180);
        ctx.strokeStyle = '#0c0b09';
        ctx.lineWidth = lineWidth;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        for (let x = -reach; x <= reach; x += spacing) {
          ctx.moveTo(x, -reach);
          ctx.lineTo(x, reach);
        }
        ctx.stroke();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        const radius = Math.max(48, Math.min(width * .39, height * .46, 290));
        const cx = width / 2;
        const cy = height / 2;
        const spacing = Math.max(5.2, Math.min(7.2, radius / 38));
        const stroke = Math.max(1.05, Math.min(1.45, spacing * .19));

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = '#f7f0e2';
        ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
        ctx.globalCompositeOperation = 'multiply';
        lineField(-angle / 2, radius, spacing, stroke, .78);
        lineField(angle / 2, radius, spacing, stroke, .78);
        ctx.restore();

        ctx.strokeStyle = 'rgba(23,21,18,.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, radius + .5, 0, Math.PI * 2);
        ctx.stroke();
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function update() {
        angle = Number(slider.value);
        const clean = Math.abs(angle) < .05 ? 0 : angle;
        readout.textContent = `${clean > 0 ? '+' : clean < 0 ? '−' : ''}${Math.abs(clean).toFixed(1)}°`;
        slider.setAttribute('aria-valuetext', `${clean > 0 ? 'positive ' : clean < 0 ? 'negative ' : ''}${Math.abs(clean).toFixed(1)} degrees`);
        draw();
      }

      slider.addEventListener('input', update);
      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(canvas);
      else window.addEventListener('resize', resize);
      resize();
      update();
    })();
  </script>
</body>
</html>
