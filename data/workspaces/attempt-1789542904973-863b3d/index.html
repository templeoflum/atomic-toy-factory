<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drift · Two pulses</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#10151e;color:#eef3f8}.toy{height:100%;width:100%;max-width:780px;margin:auto;display:flex;flex-direction:column;padding:clamp(14px,4vw,32px);gap:12px;background:radial-gradient(ellipse at 50% 42%,#1c2935 0%,#10151e 66%)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}h1{font-size:clamp(22px,4vw,32px);font-weight:550;letter-spacing:-1px;margin:0}p{margin:5px 0 0;color:#91a1b5;font-size:13px;line-height:1.5}.status{text-align:right;white-space:nowrap;padding-top:3px}.status strong{display:block;font-size:18px;font-variant-numeric:tabular-nums;font-weight:500}.status span{color:#91a1b5;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.stage{flex:1;min-height:80px;position:relative}canvas{display:block;width:100%;height:100%}.legend{display:flex;justify-content:center;gap:26px;font-size:12px;color:#b7c4d3}.legend span{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#73e0ce}.dot.b{background:#ffb879}.panel{background:#ffffff05;border:1px solid #ffffff0e;border-radius:18px;padding:17px 20px 12px}label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c9d4e0;gap:10px}output{font-size:16px;color:#ffbc82;font-variant-numeric:tabular-nums}input{display:block;width:100%;height:36px;margin:7px 0 0;cursor:pointer;appearance:none;background:transparent;touch-action:pan-y}input::-webkit-slider-runnable-track{height:5px;border-radius:10px;background:linear-gradient(to right,#ffb879 0%,#ffb879 var(--fill),#34404e var(--fill),#34404e 100%)}input::-moz-range-track{height:5px;border-radius:10px;background:#34404e}input::-moz-range-progress{height:5px;border-radius:10px;background:#ffb879}input::-webkit-slider-thumb{appearance:none;width:22px;height:22px;margin-top:-8.5px;border:4px solid #1b222d;border-radius:50%;background:#ffd0a6;box-shadow:0 0 0 1px #ffb87988}input::-moz-range-thumb{width:15px;height:15px;border:4px solid #1b222d;border-radius:50%;background:#ffd0a6;box-shadow:0 0 0 1px #ffb87988}input:focus-visible{outline:2px solid #ffb879;outline-offset:3px;border-radius:7px}.scale{display:flex;justify-content:space-between;font-size:10px;color:#7f90a5}.hint{text-align:center;font-size:11px;margin:0;color:#7f90a5}@media(max-height:420px){.toy{padding:12px;gap:6px}header p,.hint{display:none}.panel{padding:10px 14px 6px}.legend{font-size:10px}h1{font-size:22px}.status strong{font-size:15px}}
</style>
</head>
<body>
<main class="toy">
 <header><div><h1>Drift</h1><p>Two pulses. Almost the same rhythm.</p></div><div class="status"><strong id="sync">100%</strong><span>alignment</span></div></header>
 <div class="stage"><canvas id="dial" role="img" aria-label="Two repeating pulses travel around concentric rings. Mint repeats every one second; amber follows the interval slider."></canvas></div>
 <div class="legend"><span><i class="dot"></i>Steady · 1.00 s</span><span><i class="dot b"></i>Drifting pulse</span></div>
 <div class="panel"><label for="interval">Drifting pulse interval <output id="value" for="interval">1.08 s</output></label><input id="interval" type="range" min="0.70" max="1.30" step="0.01" value="1.08" aria-describedby="hint"><div class="scale"><span>0.70 s · faster</span><span>1.00 s</span><span>1.30 s · slower</span></div></div>
 <p class="hint" id="hint">Match the intervals to hold their rhythm. Change it to let them drift.</p>
</main>
<script>
(()=>{
 const canvas=document.getElementById('dial'),ctx=canvas.getContext('2d'),slider=document.getElementById('interval'),value=document.getElementById('value'),sync=document.getElementById('sync');
 let interval=1.08,a=0,b=0,last=0,w=0,h=0,dpr=1;
 function update(){interval=Number(slider.value);value.textContent=interval.toFixed(2)+' s';slider.setAttribute('aria-valuetext',interval.toFixed(2)+' seconds');slider.style.setProperty('--fill',((interval-.7)/.6*100)+'%')}
 slider.addEventListener('input',update);update();
 function resize(){const rect=canvas.getBoundingClientRect();w=rect.width;h=rect.height;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
 new ResizeObserver(resize).observe(canvas);
 function ring(phase,r,color,cx,cy){
  ctx.lineWidth=1;ctx.strokeStyle=color+'24';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  const angle=phase*Math.PI*2-Math.PI/2;
  for(let i=30;i>0;i--){const t=angle-i*.017;ctx.beginPath();ctx.arc(cx+Math.cos(t)*r,cy+Math.sin(t)*r,Math.max(1,3-i*.075),0,Math.PI*2);ctx.fillStyle=color+Math.round((1-i/31)*110).toString(16).padStart(2,'0');ctx.fill()}
  const x=cx+Math.cos(angle)*r,y=cy+Math.sin(angle)*r;
  ctx.shadowBlur=18;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
 }
 function pulse(phase,x,y,color,r){const beat=Math.exp(-phase*10);const size=r+beat*r*.4;
  const glow=ctx.createRadialGradient(x,y,0,x,y,size*3.2);glow.addColorStop(0,color+'55');glow.addColorStop(1,color+'00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,size*3.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=color+Math.round((1-phase)*90).toString(16).padStart(2,'0');ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r*(1+phase*2.5),0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=color;ctx.globalAlpha=.45+beat*.55;ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 }
 function frame(time){if(!last)last=time;const dt=Math.min((time-last)/1000,.08);last=time;a=(a+dt)%1;b=(b+dt/interval)%1;
  ctx.clearRect(0,0,w,h);const cx=w/2,cy=h/2,R=Math.min(w*.37,h*.43,160),inner=R*.79;
  let distance=Math.abs(a-b);distance=Math.min(distance,1-distance);const alignment=1-distance*2;sync.textContent=Math.round(alignment*100)+'%';
  ctx.strokeStyle='#ffffff09';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,cy-R-8);ctx.lineTo(cx,cy+R+8);ctx.stroke();
  ctx.strokeStyle='#ffffff25';ctx.beginPath();ctx.moveTo(cx,cy-R-5);ctx.lineTo(cx,cy-inner+5);ctx.stroke();
  ring(a,R,'#73e0ce',cx,cy);ring(b,inner,'#ffb879',cx,cy);
  const pr=Math.max(3,Math.min(10,R*.085));pulse(a,cx-R*.25,cy,'#73e0ce',pr);pulse(b,cx+R*.25,cy,'#ffb879',pr);
  ctx.strokeStyle='#d8f5ec'+Math.round(Math.pow(alignment,12)*100).toString(16).padStart(2,'0');ctx.beginPath();ctx.moveTo(cx-R*.25+pr*2,cy);ctx.lineTo(cx+R*.25-pr*2,cy);ctx.stroke();
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
})();
</script>
</body>
</html>
