<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standing Wave</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4fbff;
      --muted: #8da6b4;
      --cyan: #61e5ff;
      --cyan-soft: rgba(97, 229, 255, .16);
      --panel: rgba(12, 27, 37, .84);
    }

    * { box-sizing: border-box; }

    html, body {
      min-width: 280px;
      min-height: 360px;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(14px, 3vw, 32px);
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 36%, rgba(26, 86, 102, .38), transparent 48%),
        linear-gradient(145deg, #071117, #0a1c25 58%, #071016);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(920px, 100%);
      height: min(680px, 100%);
      min-height: 330px;
      display: grid;
      grid-template-rows: auto minmax(150px, 1fr) auto;
      gap: clamp(14px, 3vh, 28px);
      padding: clamp(18px, 4vw, 40px);
      border: 1px solid rgba(178, 227, 240, .13);
      border-radius: clamp(20px, 3vw, 32px);
      background: linear-gradient(160deg, rgba(15, 35, 46, .9), rgba(8, 20, 27, .92));
      box-shadow: 0 28px 80px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .04);
    }

    header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 3.2vw, 2.25rem);
      line-height: 1;
      letter-spacing: -.045em;
      font-weight: 680;
    }

    .eyebrow {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(.74rem, 1.5vw, .9rem);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .badge {
      flex: none;
      min-width: 98px;
      padding: 9px 12px;
      border: 1px solid rgba(97, 229, 255, .22);
      border-radius: 999px;
      color: var(--cyan);
      background: var(--cyan-soft);
      font-size: .77rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-align: center;
      text-transform: uppercase;
    }

    .stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(161, 215, 230, .09);
      border-radius: 22px;
      background:
        linear-gradient(rgba(97, 229, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(97, 229, 255, .035) 1px, transparent 1px),
        rgba(3, 12, 17, .55);
      background-size: 28px 28px;
    }

    svg { display: block; width: 100%; height: 100%; }

    .centerline { stroke: rgba(190, 230, 239, .16); stroke-width: 1; stroke-dasharray: 4 7; }
    .envelope { fill: none; stroke: rgba(97, 229, 255, .12); stroke-width: 1.25; stroke-dasharray: 3 6; }
    .wave-glow { fill: none; stroke: rgba(97, 229, 255, .22); stroke-width: 12; stroke-linecap: round; filter: blur(7px); }
    .wave { fill: none; stroke: var(--cyan); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .node-halo { fill: rgba(97, 229, 255, .15); }
    .node { fill: #dffaff; stroke: #143945; stroke-width: 1.5; }
    .support { fill: #203844; stroke: #53717e; stroke-width: 1; }
    .post { stroke: #78909a; stroke-width: 4; stroke-linecap: round; }
    .fixed-label { fill: #77909c; font: 600 9px ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.2px; }

    .controls {
      padding: clamp(15px, 2.5vw, 22px);
      border: 1px solid rgba(166, 221, 236, .1);
      border-radius: 18px;
      background: var(--panel);
    }

    .control-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    label { font-size: .84rem; font-weight: 650; letter-spacing: .02em; }

    output {
      color: var(--cyan);
      font-variant-numeric: tabular-nums;
      font-size: clamp(.85rem, 2vw, 1rem);
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      height: 28px;
      margin: 0;
      appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--cyan) 0 var(--fill), rgba(124, 158, 170, .2) var(--fill));
    }

    input[type="range"]::-moz-range-track { height: 6px; border-radius: 99px; background: rgba(124, 158, 170, .2); }
    input[type="range"]::-moz-range-progress { height: 6px; border-radius: 99px; background: var(--cyan); }

    input[type="range"]::-webkit-slider-thumb {
      width: 24px;
      height: 24px;
      margin-top: -9px;
      appearance: none;
      border: 3px solid #0d232d;
      border-radius: 50%;
      background: #dffaff;
      box-shadow: 0 0 0 2px var(--cyan), 0 0 18px rgba(97, 229, 255, .38);
    }

    input[type="range"]::-moz-range-thumb {
      width: 19px;
      height: 19px;
      border: 3px solid #0d232d;
      border-radius: 50%;
      background: #dffaff;
      box-shadow: 0 0 0 2px var(--cyan), 0 0 18px rgba(97, 229, 255, .38);
    }

    input[type="range"]:focus-visible { outline: 2px solid var(--cyan); outline-offset: 5px; border-radius: 5px; }

    .scale {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      color: #607984;
      font-size: .68rem;
    }

    @media (max-height: 480px) {
      main { grid-template-columns: minmax(0, 1fr) minmax(180px, .45fr); grid-template-rows: auto 1fr; gap: 12px; }
      header { grid-column: 1 / -1; }
      .controls { align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Standing Wave</h1>
        <p class="eyebrow">Fixed at both ends</p>
      </div>
      <div class="badge" aria-hidden="true">Mode <span id="modeBadge">4</span></div>
    </header>

    <div class="stage" aria-label="Animated standing wave visualization">
      <svg id="waveSvg" viewBox="0 0 800 330" preserveAspectRatio="none" role="img" aria-labelledby="waveTitle waveDescription">
        <title id="waveTitle">Standing wave between two fixed ends</title>
        <desc id="waveDescription">An animated string with five nodes, including both endpoints.</desc>
        <line class="centerline" x1="58" y1="165" x2="742" y2="165" />
        <path id="upperEnvelope" class="envelope" />
        <path id="lowerEnvelope" class="envelope" />
        <line class="post" x1="48" y1="91" x2="48" y2="239" />
        <path class="support" d="M28 252h40l-7-13H35z" />
        <line class="post" x1="752" y1="91" x2="752" y2="239" />
        <path class="support" d="M732 252h40l-7-13h-26z" />
        <text class="fixed-label" x="48" y="273" text-anchor="middle">FIXED</text>
        <text class="fixed-label" x="752" y="273" text-anchor="middle">FIXED</text>
        <path id="waveGlow" class="wave-glow" />
        <path id="wave" class="wave" />
        <g id="nodes"></g>
      </svg>
    </div>

    <section class="controls" aria-label="Wave controls">
      <div class="control-top">
        <label for="nodeCount">Number of nodes</label>
        <output id="readout" for="nodeCount" aria-live="polite">5 nodes · 4 loops</output>
      </div>
      <input id="nodeCount" type="range" min="2" max="9" value="5" step="1" aria-describedby="nodeHint">
      <div class="scale" id="nodeHint" aria-hidden="true"><span>2</span><span>9</span></div>
    </section>
  </main>

  <script>
    (() => {
      const slider = document.getElementById('nodeCount');
      const readout = document.getElementById('readout');
      const badge = document.getElementById('modeBadge');
      const description = document.getElementById('waveDescription');
      const wave = document.getElementById('wave');
      const glow = document.getElementById('waveGlow');
      const upper = document.getElementById('upperEnvelope');
      const lower = document.getElementById('lowerEnvelope');
      const nodesGroup = document.getElementById('nodes');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const left = 58, right = 742, center = 165, amplitude = 92, samples = 180;
      let nodeCount = Number(slider.value);

      function pathFor(multiplier, loops = nodeCount - 1) {
        let path = '';
        for (let i = 0; i <= samples; i++) {
          const u = i / samples;
          const x = left + (right - left) * u;
          const y = center - amplitude * Math.sin(Math.PI * loops * u) * multiplier;
          path += `${i ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`;
        }
        return path;
      }

      function drawNodes() {
        nodesGroup.replaceChildren();
        for (let i = 0; i < nodeCount; i++) {
          const x = left + (right - left) * i / (nodeCount - 1);
          const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          halo.setAttribute('class', 'node-halo');
          halo.setAttribute('cx', x);
          halo.setAttribute('cy', center);
          halo.setAttribute('r', '10');
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('class', 'node');
          dot.setAttribute('cx', x);
          dot.setAttribute('cy', center);
          dot.setAttribute('r', '4.5');
          nodesGroup.append(halo, dot);
        }
      }

      function update() {
        nodeCount = Number(slider.value);
        const loops = nodeCount - 1;
        const pct = (nodeCount - Number(slider.min)) / (Number(slider.max) - Number(slider.min)) * 100;
        slider.style.setProperty('--fill', `${pct}%`);
        readout.value = `${nodeCount} nodes · ${loops} ${loops === 1 ? 'loop' : 'loops'}`;
        badge.textContent = loops;
        description.textContent = `An animated string with ${nodeCount} nodes, including both fixed endpoints.`;
        upper.setAttribute('d', pathFor(1));
        lower.setAttribute('d', pathFor(-1));
        drawNodes();
      }

      function animate(time) {
        const phase = reducedMotion ? .72 : Math.cos(time * .0022);
        const path = pathFor(phase);
        wave.setAttribute('d', path);
        glow.setAttribute('d', path);
        requestAnimationFrame(animate);
      }

      slider.addEventListener('input', update);
      update();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
